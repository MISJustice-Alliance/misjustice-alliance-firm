global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: mcpjungle
    metrics_path: /metrics
    static_configs:
      - targets: ["mcpjungle:8080"]

  - job_name: honcho-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["honcho-exporter:9103"]
